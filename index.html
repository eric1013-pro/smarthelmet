<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartHelmet CAD — 모듈형 스마트 안전모 3D 모델링 및 2D 설계 도면</title>
    <meta name="description" content="KCs 무천공 탈부착 모듈형 스마트 안전모(Arduino Uno + ATmega128 TPK-128V2.4 관제) 3D CAD 모델링, 2D 정투상 설계 도면 및 배선 스튜디오" />
    <meta property="og:title" content="SmartHelmet CAD — 모듈형 스마트 안전모 3D 모델링 및 2D 설계 도면" />
    <meta property="og:description" content="KCs 무천공 탈부착 모듈형 스마트 안전모 3D CAD 모델링, 2D 정투상 설계 도면 및 배선 스튜디오" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        var lastErr = '';
        window.addEventListener('error', function (e) {
          if (e && e.message) lastErr = e.message;
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason) lastErr = String(e.reason);
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            root.innerHTML =
              '<div style="max-width:560px;margin:64px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;font-family:sans-serif;color:#0f172a;line-height:1.6;">' +
              '<h2 style="margin:0 0 8px;font-size:17px;font-weight:700;">앱 스크립트가 로드되지 않았습니다</h2>' +
              '<p style="margin:0 0 12px;font-size:13px;color:#475569;">GitHub Pages에서 빈 화면이 보인다면 저장소의 <strong>Settings → Pages → Build and deployment → Source</strong>가 <strong>GitHub Actions</strong>로 선택되어 있는지 확인해 주세요. (Deploy from a branch로 되어 있으면 빌드되지 않은 원본 파일이 열려 흰 화면이 나타납니다.)</p>' +
              '<p style="margin:0 0 12px;font-size:13px;color:#475569;">이미 GitHub Actions로 설정되어 있다면 <strong>Ctrl + Shift + R</strong>(강력 새로고침)을 눌러 캐시를 비워 주세요.</p>' +
              (lastErr ? '<pre style="margin:0;padding:10px;background:#fef2f2;color:#991b1b;border-radius:8px;font-size:12px;overflow:auto;">' + lastErr.replace(/</g, '&lt;') + '</pre>' : '') +
              '</div>';
          }
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
